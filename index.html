<head>
  <meta charset="UTF-8">

  <style>
    * { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: #030303; 
      color: #fff; 
      min-height: 100vh; 
      overflow-x: hidden;
      cursor: default;
    }

    /* Ambient background orbs */
    .orb { 
      position: fixed; 
      border-radius: 50%; 
      filter: blur(120px); 
      opacity: 0.35; 
      z-index: -1; 
      animation: drift 25s ease-in-out infinite alternate; 
      pointer-events: none;
    }
    .orb-1 { 
      width: 500px; 
      height: 500px; 
      background: radial-gradient(circle, rgba(52,211,153,0.5), transparent 70%); 
      top: -15%; 
      left: -10%; 
    }
    .orb-2 { 
      width: 450px; 
      height: 450px; 
      background: radial-gradient(circle, rgba(168,85,247,0.4), transparent 70%); 
      bottom: -10%; 
      right: -15%; 
      animation-delay: -8s; 
    }
    .orb-3 { 
      width: 350px; 
      height: 350px; 
      background: radial-gradient(circle, rgba(34,211,238,0.3), transparent 70%); 
      top: 45%; 
      left: 55%; 
      animation-delay: -16s; 
    }

    @keyframes drift { 
      0% { transform: translate(0, 0) scale(1); } 
      33% { transform: translate(40px, -40px) scale(1.15); } 
      66% { transform: translate(-30px, 30px) scale(0.9); } 
      100% { transform: translate(15px, -20px) scale(1.08); } 
    }

    /* Noise texture overlay */
    .noise {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Glass card base */
    .glass { 
      background: rgba(255, 255, 255, 0.025); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px); 
      border: 1px solid rgba(255, 255, 255, 0.06); 
    }

    /* Link buttons with spotlight effect */
    .link-btn { 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      padding: 18px 22px; 
      border-radius: 18px; 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      color: #fff; 
      text-decoration: none; 
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
      position: relative; 
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.06),
        transparent 40%
      );
      opacity: 0;
      transition: opacity 0.3s;
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-btn:hover { 
      transform: translateY(-3px) scale(1.02); 
      border-color: rgba(255, 255, 255, 0.12); 
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .link-tiktok:hover { 
      box-shadow: 0 20px 50px -15px rgba(255, 0, 80, 0.25); 
      border-color: rgba(255, 0, 80, 0.25); 
    }
    .link-youtube:hover { 
      box-shadow: 0 20px 50px -15px rgba(255, 0, 0, 0.25); 
      border-color: rgba(255, 0, 0, 0.25); 
    }
    .link-insta:hover { 
      box-shadow: 0 20px 50px -15px rgba(225, 48, 108, 0.25); 
      border-color: rgba(225, 48, 108, 0.25); 
    }
    .link-telegram:hover { 
      box-shadow: 0 20px 50px -15px rgba(0, 136, 204, 0.25); 
      border-color: rgba(0, 136, 204, 0.25); 
    }
    .link-facebook:hover { 
      box-shadow: 0 20px 50px -15px rgba(24, 119, 242, 0.25); 
      border-color: rgba(24, 119, 242, 0.25); 
    }

    /* Avatar with animated gradient ring */
    .avatar-wrap { 
      position: relative; 
      width: 104px; 
      height: 104px; 
      margin: 0 auto 20px; 
    }
    .avatar-wrap::before { 
      content: ''; 
      position: absolute; 
      inset: -4px; 
      border-radius: 50%; 
      background: conic-gradient(from 0deg, #34d399, #22d3ee, #a78bfa, #f472b6, #34d399); 
      animation: spin 6s linear infinite; 
      filter: blur(2px);
      opacity: 0.8;
    }
    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #34d399, #22d3ee, #a78bfa, #f472b6, #34d399);
      animation: spin 6s linear infinite;
      opacity: 0.3;
      filter: blur(8px);
    }
    
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    .avatar { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      background: #0a0a0a; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: 3px solid #0a0a0a; 
      overflow: hidden; 
      z-index: 1;
    }
    .avatar img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar:hover img {
      transform: scale(1.08);
    }

    /* Stagger animations */
    .stagger { 
      opacity: 0; 
      transform: translateY(30px); 
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }
    .stagger:nth-child(1) { animation-delay: 0.1s; } 
    .stagger:nth-child(2) { animation-delay: 0.18s; } 
    .stagger:nth-child(3) { animation-delay: 0.26s; } 
    .stagger:nth-child(4) { animation-delay: 0.34s; } 
    .stagger:nth-child(5) { animation-delay: 0.42s; } 
    .stagger:nth-child(6) { animation-delay: 0.5s; } 
    .stagger:nth-child(7) { animation-delay: 0.58s; } 
    .stagger:nth-child(8) { animation-delay: 0.66s; } 
    .stagger:nth-child(9) { animation-delay: 0.74s; }

    @keyframes fadeUp { 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* Toast notification */
    #toast { 
      position: fixed; 
      bottom: 28px; 
      left: 50%; 
      transform: translateX(-50%) translateY(100px); 
      opacity: 0; 
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
      z-index: 100; 
    }
    #toast.show { 
      transform: translateX(-50%) translateY(0); 
      opacity: 1; 
    }

    /* Icon boxes */
    .icon-box { 
      width: 46px; 
      height: 46px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .link-btn:hover .icon-box {
      transform: scale(1.1) rotate(-5deg);
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Cursor glow */
    .cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s;
    }

    /* Verified badge */
    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #34d399, #22d3ee);
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Stats row */
    .stat-item {
      text-align: center;
      padding: 0 16px;
      position: relative;
    }
    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.08);
    }

    /* Smooth scroll */
    html { scroll-behavior: smooth; }

    /* Selection color */
    ::selection {
      background: rgba(52, 211, 153, 0.3);
      color: #fff;
    }

    /* Share button pulse */
    .share-btn {
      position: relative;
    }
    .share-btn::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* External link arrow animation */
    .arrow-icon {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .link-btn:hover .arrow-icon {
      transform: translate(3px, -3px);
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .link-btn { padding: 16px 18px; }
      .avatar-wrap { width: 90px; height: 90px; }
    }
  </style>

  </div>

  <script>
    // Copy link function
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const t = document.getElementById('toast'); 
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      }).catch(() => {
        const ta = document.createElement('textarea'); 
        ta.value = window.location.href;
        document.body.appendChild(ta); 
        ta.select(); 
        document.execCommand('copy'); 
        document.body.removeChild(ta);
        const t = document.getElementById('toast'); 
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      });
    }

    // Mouse-following spotlight on link cards
    document.querySelectorAll('.link-btn').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mouse-x', `${x}%`);
        card.style.setProperty('--mouse-y', `${y}%`);
      });
    });

    // Cursor glow effect
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = 0, mouseY = 0;
    let glowX = 0, glowY = 0;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.1;
      glowY += (mouseY - glowY) * 0.1;
      cursorGlow.style.left = glowX + 'px';
      cursorGlow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    // Floating particles
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
      particle.style.opacity = Math.random() * 0.3 + 0.1;
      const size = Math.random() * 3 + 1;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      document.getElementById('particles').appendChild(particle);
      
      setTimeout(() => particle.remove(), 25000);
    }

    setInterval(createParticle, 800);
    for (let i = 0; i < 15; i++) setTimeout(createParticle, i * 300);

    // 3D tilt effect on link buttons
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 15;
        const rotateY = (centerX - x) / 15;
        btn.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-3px) scale(1.02)`;
      });
      
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = '';
      });
    });
  </script>
</body>
</html>
